name: 'platform-build'

on:
  push:
    tags:
      - v*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 14
      - name: Cache node modules
        uses: actions/cache@v4
        id: cache
        with:
          path: node_modules
          # package-lock.json 은 저장소에 없어 해시가 항상 빈 값이 되고, 그 결과
          # 캐시 키가 고정되어 package.json 변경 후에도 낡은 node_modules 가
          # 복원되면서 Install Dependencies 가 건너뛰어졌다.
          # 추적되는 package.json 을 해시해 의존성 변경 시 캐시가 무효화되도록 한다.
          key: npm-packages-${{ hashFiles('package.json') }}
      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install
      - name: Install additional packages
        run: npm install zod@3.24.1
      - name: Install additional packages
        run: npm install zod-to-json-schema@3.9.4
      - name: npm build
        run: npm run build
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ID }}
          password: ${{ secrets.TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

# =====================================================================
# MSAez 설치형 docker-compose (v1.0.30 — PostgreSQL 전환판, 단일 VM)
#
# v1.0.29 대비 변경:
#   - acebase 제거 → postgres + msaez-data-gateway 컨테이너 추가
#   - 백엔드의 ACEBASE_* → POSTGRES_*, STORAGE_TYPE/DB_TYPE → postgres
#   - 백엔드/게이트웨이는 compose 내부 네트워크로 postgres 접근
#     (POSTGRES_HOST: postgres)
#
# 분리 VM(DB/AP 호스트 분리) 환경은 별도 파일 사용:
#   - docker-compose.split.db.yml  (DB 서버용 — postgres + data-gateway)
#   - docker-compose.split.ap.yml  (AP 서버용 — msaez + backend×2 + gitea)
#
# 설정 방법은 README.md 참조. <...> 부분을 환경에 맞게 채울 것.
# =====================================================================

networks:
  msaez:
    external: false

volumes:
  msaez_pgdata:

services:
  # ── PostgreSQL — 데이터 저장소 (AceBase 대체) ──────────────────────
  postgres:
    image: postgres:16
    container_name: msaez-postgres
    networks:
      - msaez
    environment:
      POSTGRES_USER: msaez
      POSTGRES_PASSWORD: <DB_PASSWORD>   # 임의의 강한 비밀번호로 변경
      POSTGRES_DB: msaez
    volumes:
      - msaez_pgdata:/var/lib/postgresql/data
      # 최초 기동 시 스키마(001_init, 002_notify) 자동 적용
      - ./data-gateway/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # 백엔드/게이트웨이는 docker network 로 접근하므로 5432 호스트 노출은 불필요.
      # loopback 바인딩으로 두면 외부에서 안 보임 (방화벽 변경 불필요 — 계획서 §3.2).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msaez -d msaez"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ── msaez-data-gateway — AceBase 자리(5757) 대체 ──────────────────
  # OAuth + Data API + 실시간 watch 를 담당하는 stateless 프록시.
  # 상태(데이터) 는 모두 postgres 에 저장되므로 컨테이너 재기동/삭제는 안전.
  msaez-data-gateway:
    image: ghcr.io/msa-ez/msaez-data-gateway:v1.0.30
    container_name: msaez-data-gateway
    networks:
      - msaez
    ports:
      - "5757:5757"
    depends_on:
      - postgres
    environment:
      GATEWAY_PORT: 5757
      DB_NAME: mydb
      # PostgreSQL — postgres 컨테이너 서비스명으로 접근
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: msaez
      POSTGRES_USER: msaez
      POSTGRES_PASSWORD: <DB_PASSWORD>          # postgres 와 동일한 값
      # JWT 서명 시크릿 — openssl rand -hex 32 로 생성. 한 번 정하면 절대 바꾸지 말 것
      # (바꾸면 로그인한 사용자 전원이 로그아웃됨)
      JWT_SECRET: <JWT_SECRET>
      # ── 가입 승인(admin approval) ──────────────────────────────────
      # 여기 지정한 이메일(콤마구분)로 로그인하면 admin 권한 + 자동 승인.
      # 값이 하나라도 있으면 승인제가 켜져, 신규 유저는 admin 승인 전까지
      # enrolledUsers 미등록 + 모든 기능 차단(승인대기 화면). 강제 on/off 는 REQUIRE_APPROVAL.
      ADMIN_EMAILS: "yang1762@uengine.org"
      # Gitea OAuth — v1.0.29 의 값 그대로 재사용 (코드생성용 Gitea 접근에 계속 사용)
      PROVIDER: gitea
      CLIENT_ID: <GITEA_OAUTH_CLIENT_ID>
      CLIENT_SECRET: <GITEA_OAUTH_CLIENT_SECRET>
      GIT: <VM_IP>:3000                          # 브라우저가 접근하는 Gitea 주소
      PROTOCOL: http
      # ── SWP(POSCO) SSO — 로그인 경로 (가동계/운영 기준) ────────────────
      # OIDC 가 아닌 SWP HTTP 인증 토큰 방식. Gitea OAuth 와 독립적으로 동작한다.
      # ⚠️ 게이트웨이(VM)가 아래 SWP 호스트에 접근 가능해야 함(hosts/DNS 등록).
      SWP_SSO_REDIRECT_URL: "http://swpsso.posco.net/idms/U61/jsp/redirect.jsp?redir_url="
      SWP_SSO_VALID_CHECK_URL: "http://swpsso.posco.net/idms/U61/jsp/isValidSSO.jsp"
      SWP_SSO_LOGIN_URL: "http://swp.posco.net"
      # isValidSSO 응답(콤마 구분) 필드 인덱스 — 현장 raw 로그 확인 후 필요 시만 조정.
      # 기본값은 "2-1. (SWP) 사용자 정보" 표 순서(0=iv-user,1=sp_empno,8=displayname,9=mail,4=seealso).
      SWP_IDX_ID: "0"
      SWP_IDX_EMPNO: "1"
      SWP_IDX_DISPLAYNAME: "8"
      SWP_IDX_MAIL: "9"
      SWP_IDX_DEPT: "4"
      SWP_EMAIL_FALLBACK_DOMAIN: "posco.local"
    restart: unless-stopped

  # ── msaez — 프론트엔드 ─────────────────────────────────────────────
  msaez:
    image: ghcr.io/msa-ez/platform:v1.0.30
    networks:
      - msaez
    ports:
      - 8080:8080
    environment:
      VUE_APP_DB_HOST: <VM_IP>     # 게이트웨이 호스트 (브라우저가 접근하는 주소, 예: 34.64.202.245)
      VUE_APP_DB_PORT: 5757        # 게이트웨이 포트
      VUE_APP_DB_NAME: mydb
      VUE_APP_MODE: onprem
      VUE_APP_DB_HTTPS: "false"
      VUE_APP_GIT: gitea                          # 코드생성용 git provider — posco 로 바꾸지 말 것(코드생성 깨짐)
      VUE_APP_AUTH_PROVIDER: posco                # 로그인 provider — SWP SSO 사용(빈값/미설정이면 Gitea OAuth)
      VUE_APP_GIT_URL: http://<VM_IP>:3000        # Gitea URL (브라우저 접근 주소)
      VUE_APP_GITEA_TOKEN: "<GITEA_PERSONAL_ACCESS_TOKEN>"
      VUE_APP_BACKEND_URL: http://<VM_IP>:2025    # Backend URL
    restart: unless-stopped

  # ── backend-generators (Project Generator) ────────────────────────
  backend-generators:
    image: ghcr.io/msa-ez/msaez-automate-project-generator:v1.0.30
    container_name: backend-generators
    networks:
      - msaez
    ports:
      - "2025:2025"
    depends_on:
      - postgres
    environment:
      # ──────────────────────────────────────────────────────────────
      # LLM API Key 설정 (OpenAI SDK 표준 환경변수로 통일)
      # ──────────────────────────────────────────────────────────────
      # [기본: OpenAI 직접 호출]
      #   - OPENAI_API_KEY 만 설정하면 api.openai.com으로 호출됩니다.
      #   - OPENAI_BASE_URL 은 비워두거나 미설정.
      #
      # [P-GPT(POSCO 사내 LLM 게이트웨이) 사용 시]
      #   - OPENAI_BASE_URL 에 P-GPT 엔드포인트를 지정하면
      #     Chat/Responses/Models 호출이 P-GPT로 라우팅됩니다. (OpenAI 호환)
      #   - OPENAI_API_KEY 에 P-GPT에서 발급받은 API Key를 입력합니다.
      #   - P-GPT는 임베딩(Embedding)을 지원하지 않으므로,
      #     OPENAI_EMBEDDING_API_KEY 에 "실제 OpenAI API Key"를 반드시 별도 설정해야 합니다.
      #     (project backend에서 표준 변환 시 임베딩을 사용)
      #   - P-GPT 엔드포인트:
      #       개발계: http://taigpt.posco.net/gpgpta01-gpt/v1
      #       운영계: http://aigpt.posco.net/gpgpta01-gpt/v1
      # ──────────────────────────────────────────────────────────────
      OPENAI_API_KEY: your-openai-api-key-here              # OpenAI 직접 사용 시: OpenAI Key / P-GPT 사용 시: P-GPT Key
      # OPENAI_BASE_URL: http://aigpt.posco.net/gpgpta01-gpt/v1   # P-GPT 사용 시 주석 해제
      OPENAI_EMBEDDING_API_KEY: your-openai-api-key-here    # 임베딩용 실제 OpenAI Key (P-GPT 사용 시 필수)
      DEFAULT_LLM_MODEL: gpt-4o
      # OPENAI_EMBEDDING_BASE_URL: https://...              # (선택) 별도 임베딩 엔드포인트 사용 시
      # DB 설정 — PostgreSQL (v1.0.30)
      STORAGE_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: msaez
      POSTGRES_USER: msaez
      POSTGRES_PASSWORD: <DB_PASSWORD>
      # Flask 서버 설정
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 2025
      # 기타 설정
      ENVIRONMENT: production
      IS_LOCAL_RUN: "true"  # Docker Compose 환경에서는 Kubernetes autoscaler 비활성화
      NAMESPACE: eventstorming_generator
      POD_ID: docker-pod
    restart: unless-stopped

  # ── backend-es-generators (Event Storming Generator) ──────────────
  backend-es-generators:
    image: ghcr.io/msa-ez/msaez-automate-eventstorming-generator:v1.0.30
    container_name: backend-es-generators
    networks:
      - msaez
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      # ──────────────────────────────────────────────────────────────
      # LLM API Key 설정 (OpenAI SDK 표준 환경변수로 통일)
      # ──────────────────────────────────────────────────────────────
      # [기본: OpenAI / Google AI 직접 호출]
      #   - OPENAI_API_KEY, GOOGLE_API_KEY 중 사용하는 모델에 맞춰 설정.
      #   - OPENAI_BASE_URL 은 비워두거나 미설정.
      #
      # [P-GPT(POSCO 사내 LLM 게이트웨이) 사용 시]
      #   - OPENAI_BASE_URL 에 P-GPT 엔드포인트를 지정하면
      #     Chat/Responses/Models 호출이 P-GPT로 라우팅됩니다. (OpenAI 호환)
      #   - OPENAI_API_KEY 에 P-GPT에서 발급받은 API Key를 입력합니다.
      #   - P-GPT 엔드포인트:
      #       개발계: http://taigpt.posco.net/gpgpta01-gpt/v1
      #       운영계: http://aigpt.posco.net/gpgpta01-gpt/v1
      #   - AI_MODEL / AI_MODEL_LIGHT 는 P-GPT에서 제공하는 모델명으로 변경 필요
      #     (예: openai:gpt-4o, openai:gpt-4o-mini → /v1/models 로 확인)
      # ──────────────────────────────────────────────────────────────
      GOOGLE_API_KEY: your-google-api-key-here
      OPENAI_API_KEY: your-open-api-key-here                # OpenAI 직접 사용 시: OpenAI Key / P-GPT 사용 시: P-GPT Key
      # OPENAI_BASE_URL: http://aigpt.posco.net/gpgpta01-gpt/v1   # P-GPT 사용 시 주석 해제
      # AI 모델 설정 (P-GPT 사용 시 P-GPT가 제공하는 모델명으로 변경)
      AI_MODEL: openai:gpt-4.1-2025-04-14
      AI_MODEL_MAX_INPUT_LIMIT: 523788
      AI_MODEL_MAX_BATCH_SIZE: 15
      AI_MODEL_LIGHT: openai:gpt-4.1-mini-2025-04-14
      AI_MODEL_LIGHT_MAX_INPUT_LIMIT: 523788
      AI_MODEL_LIGHT_MAX_BATCH_SIZE: 30
      # DB 설정 — PostgreSQL (v1.0.30)
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: msaez
      POSTGRES_USER: msaez
      POSTGRES_PASSWORD: <DB_PASSWORD>
      # A2A 서버 설정
      A2A_HOST: 0.0.0.0
      A2A_PORT: 5000
      A2A_EXTERNAL_URL: http://<VM_IP>:5000    # A2A 서버 외부 URL
      # 기타 설정
      NAMESPACE: eventstorming_generator
      POD_ID: docker-pod
      IS_LOCAL_RUN: "true"  # Docker Compose 환경에서는 Kubernetes autoscaler 비활성화
      USE_GENERATOR_CACHE: "true"
    restart: unless-stopped

  # ── Gitea — Git 서버 + OAuth provider ──────────────────────────────
  gitea:
    image: gitea/gitea:1.22.3
    container_name: gitea
    networks:
      - msaez
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    volumes:
      - ./gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
